[project]
name = "aliver"
version = "0.6.0"
description = "Local-first control plane for AI live avatar experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "httpx>=0.27,<1.0",
  "cryptography>=43,<46",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "websockets>=14,<16",
  "PyAudioWPatch>=0.2.12.8,<0.3; sys_platform == 'win32'",
  "simli-ai>=2.0.2,<3.0; sys_platform == 'win32'",
  "opencv-python>=4.10,<5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "bridge*"]
exclude = ["chrome_extension*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"bridge/audio_capture.py" = ["F841"]
