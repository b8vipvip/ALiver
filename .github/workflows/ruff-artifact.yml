name: Ruff diagnostics

on:
  pull_request:

jobs:
  ruff-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'ruff>=0.8,<1.0'
      - name: Capture Ruff output
        run: ruff check app bridge tests > ruff-output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: ruff-output.txt
