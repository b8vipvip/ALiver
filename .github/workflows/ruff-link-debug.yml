name: Ruff Link Debug

on:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - name: Capture Ruff report
        run: ruff check app bridge tests --output-format concise > ruff.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-link-report
          path: ruff.txt
