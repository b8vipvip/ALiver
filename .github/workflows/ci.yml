name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      ALIVER_DATABASE_URL: sqlite:///./data/test.db
      ALIVER_SECRET_KEY: test-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: node --check chrome_extension/background.js
      - run: node --check chrome_extension/content.js
      - run: node --check chrome_extension/popup.js
      - run: node --check app/static/auto_director.js
      - run: node --check app/static/gpt_in_speech_patch.js
      - run: node --check app/static/simli_tuning.js
      - run: node --check app/static/simli_link_diagnostics.js
      - run: python -m pip install --quiet --upgrade pip
      - run: pip install --quiet -e ".[dev]"
      - run: ruff check app bridge tests
      - run: pytest
