name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      ALIVER_DATABASE_URL: sqlite:///./data/test.db
      ALIVER_SECRET_KEY: test-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: node --check chrome_extension/background.js
      - run: node --check chrome_extension/content.js
      - run: node --check chrome_extension/popup.js
      - run: node --check app/static/auto_director.js
      - run: node --check app/static/auto_director_refresh_fix.js
      - run: node --check app/static/director_plan_generator.js
      - run: node --check app/static/douyin_live_collector.js
      - run: node --check app/static/douyin_capture_diagnostics.js
      - run: node --check app/static/full_validation.js
      - run: node --check app/static/console_layout_v2.js
      - run: node --check app/static/live_debug_validation.js
      - run: node --check app/static/live_debug_validation_v2.js
      - run: node --check app/static/wgc_hwnd_ui_patch.js
      - run: node --check app/static/audio_live_setup.js
      - run: node --check app/static/gpt_in_speech_patch.js
      - run: node --check app/static/local_time_patch.js
      - run: node --check app/static/provider_catalog.js
      - run: node --check app/static/avatar_debug_v2.js
      - run: node --check app/static/management_v2.js
      - run: node --check app/static/audio_route_autostart.js
      - run: node --check app/static/vtube_motion_wizard.js
      - run: node --check app/static/vtube_motion_controls_fix.js
      - run: node --check app/static/avatar_action_runtime.js
      - run: python -m py_compile bridge/douyin_visible_collector.py bridge/douyin_visible_runtime_patch.py bridge/douyin_ocr_result_patch.py bridge/douyin_window_capture_patch.py bridge/douyin_region_occlusion_patch.py bridge/douyin_three_channel_patch.py bridge/douyin_wgc_hwnd_patch.py bridge/douyin_wgc_safe_fallback_patch.py bridge/douyin_three_channel_config_patch.py bridge/douyin_validation_fix.py bridge/full_validation.py bridge/full_validation_v2.py bridge/live_debug_defaults.py bridge/audio_live_setup.py bridge/douyin_scan_logging_patch.py app/live_welcome_patch.py app/live_welcome_ingest_patch.py
      - run: python -m pip install --quiet --upgrade pip
      - run: pip install --quiet -e ".[dev]"
      - run: ruff check app bridge tests
      - run: pytest
