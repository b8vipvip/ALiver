name: Ruff Debug

on:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff==0.8.6
      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          ruff check app bridge tests --output-format=concise > ruff.txt 2>&1
          status=$?
          cat ruff.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
        id: ruff
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: ruff.txt
