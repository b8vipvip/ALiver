name: Bootstrap ALiver source

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'bootstrap-aliver-')) ||
      (github.event_name == 'pull_request_target' && startsWith(github.event.pull_request.title, 'bootstrap-aliver-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/aliver.tar.gz
          tar -xzf /tmp/aliver.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add ALiver local control server'
          git push origin main
