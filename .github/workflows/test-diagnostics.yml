name: Test diagnostics temporary

on:
  pull_request:

jobs:
  pytest-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --upgrade pip
      - run: pip install --quiet -e ".[dev]"
      - name: Capture pytest output
        run: pytest > pytest-output.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt
